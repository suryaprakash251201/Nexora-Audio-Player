name: nexora_flutter
description: "Nexora — Audiophile self-hosted music player (Flutter). Streams from your Nexora server with offline cache, background playback, and cassette visuals."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.1
  share_plus: ^13.3.0
  dio: ^5.11.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  cached_network_image: ^3.4.1
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  # Android 8+ adaptive icon — dark audiophile background (#0B0B12 matches
  # assets/android-icon-background.png) so the light glass logo pops on
  # both light and dark launchers.
  adaptive_icon_background: "#0B0B12"
  adaptive_icon_foreground: "assets/logo.png"
  adaptive_icon_monochrome: "assets/logo.png"
  remove_alpha_ios: true
  background_color_ios: "#0B0B12"
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#0B0B12"
    theme_color: "#0B0B12"
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/logo.png"
