name: Build Android & iOS (Unsigned)

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)

# Cancel any in-progress runs for the same ref so a new dispatch wins.
concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true # Caches pub dependencies across runs

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Install dependencies
      run: flutter pub get

    - name: Accept Android licenses
      # ubuntu-latest usually ships pre-accepted; this is a safe no-op fallback.
      run: yes | sdkmanager --licenses || true
      env:
        ANDROID_HOME: ${{ env.ANDROID_HOME || '/usr/local/lib/android/sdk' }}

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nexora-android-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        if-no-files-found: error

  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Build iOS (No Codesign)
      run: flutter build ios --release --no-codesign

    - name: Package Unsigned IPA
      run: |
        mkdir -p build/ios/iphoneos/Payload
        mv build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
        cd build/ios/iphoneos
        zip -qq -r NexoraAudio.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nexora-ios-unsigned-ipa
        path: build/ios/iphoneos/NexoraAudio.ipa
        if-no-files-found: error
