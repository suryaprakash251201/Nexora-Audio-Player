name: Build Windows (Release)

on:
  workflow_dispatch: # Manual trigger from the GitHub Actions tab
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)

# Cancel any in-progress runs for the same ref so a new dispatch wins.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows EXE (Release)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Caches pub dependencies across runs

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons from assets/logo.png
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Release folder (ZIP)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ([string]::IsNullOrEmpty($version)) { $version = "dev" }
          $src = "build/windows/x64/runner/Release"
          if (-not (Test-Path $src)) { throw "Release folder not found: $src" }
          Compress-Archive -Path "$src/*" -DestinationPath "NexoraAudio-Windows-$version.zip" -Force
          Get-ChildItem "NexoraAudio-Windows-$version.zip"

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: nexora-windows-release
          path: NexoraAudio-Windows-*.zip
          if-no-files-found: error
