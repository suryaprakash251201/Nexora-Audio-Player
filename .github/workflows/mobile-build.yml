name: Mobile Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to create a release for (leave empty for build-only)"
        required: false
        type: string
      build_ios:
        description: "Also build the iOS unsigned IPA (sideload)"
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  build-android:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: install dependencies
        run: npm ci --legacy-peer-deps

      - name: verify patches
        run: npx patch-package --error-on-fail

      - name: expo prebuild (android)
        run: npx expo prebuild -p android --no-install

      - name: build release APK
        run: ./gradlew assembleRelease
        working-directory: ./android

      - name: upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-audiophile-android
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 14

  build-ios:
    # Mirrors upstream nexora: run on push/tags by default, and on workflow_dispatch only if build_ios == true
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.build_ios == 'true'
    permissions:
      contents: read
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install dependencies
        run: npm ci --legacy-peer-deps

      - name: verify patches
        run: npx patch-package --error-on-fail

      - name: expo prebuild (ios)
        run: npx expo prebuild -p ios --no-install

      - name: install CocoaPods
        run: |
          set -x
          echo "CocoaPods version:"
          pod --version || (sudo gem install cocoapods --no-document && pod --version)
          echo "Pod env:"
          pod env | head -30
          echo "Running pod install --repo-update..."
          pod install --repo-update --verbose 2>&1 | tee pod.log; status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "pod install failed, retrying without repo-update..."
            pod install --verbose 2>&1 | tee -a pod.log
            status=${PIPESTATUS[0]}
          fi
          exit $status
        working-directory: ./ios

      - name: upload pod log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pod-install-log
          path: ios/pod.log
          if-no-files-found: warn
          retention-days: 7

      # ── Device build (unsigned) — for sideloading via Sideloadly/AltStore ──
      - name: build unsigned device app
        run: |
          set -x
          # `expo prebuild` generates a `.xcodeproj`; when CocoaPods runs it also
          # creates a matching `.xcworkspace`. Prefer the workspace when present,
          # otherwise fall back to the xcodeproj so we never pass an empty target.
          if ls *.xcworkspace >/dev/null 2>&1; then
            XCODE_TARGET="$(ls *.xcworkspace | head -n1)"
            XCODE_FLAG="-workspace"
          else
            XCODE_TARGET="$(ls *.xcodeproj | head -n1)"
            XCODE_FLAG="-project"
          fi
          SCHEME="$(basename "$XCODE_TARGET" | sed -E 's/\.(xcworkspace|xcodeproj)$//')"
          echo "Xcode target: $XCODE_TARGET"
          echo "Scheme: $SCHEME"
          xcodebuild "$XCODE_FLAG" "$XCODE_TARGET" -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ios-build.log
          exit ${PIPESTATUS[0]}

      - name: upload device build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-build-log
          path: ios/ios-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: package unsigned IPA
        run: |
          set -e
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qry nexora-audiophile-unsigned.ipa Payload
          rm -rf Payload
          ls -lh nexora-audiophile-unsigned.ipa
        working-directory: ./ios

      - name: upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-audiophile-ios-ipa
          path: ios/nexora-audiophile-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      # ── Simulator build (no signing needed) ───────────────────────────────
      - name: build simulator app
        run: |
          set -x
          if ls *.xcworkspace >/dev/null 2>&1; then
            XCODE_TARGET="$(ls *.xcworkspace | head -n1)"
            XCODE_FLAG="-workspace"
          else
            XCODE_TARGET="$(ls *.xcodeproj | head -n1)"
            XCODE_FLAG="-project"
          fi
          SCHEME="$(basename "$XCODE_TARGET" | sed -E 's/\.(xcworkspace|xcodeproj)$//')"
          xcodebuild "$XCODE_FLAG" "$XCODE_TARGET" -scheme "$SCHEME" \
            -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ios-sim-build.log
          exit ${PIPESTATUS[0]}
        working-directory: ./ios

      - name: upload simulator build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-build-log
          path: ios/ios-sim-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: zip simulator app
        run: |
          set -e
          APP=$(ls build-sim/Build/Products/Debug-iphonesimulator/*.app | head -n1)
          echo "Simulator app: $APP"
          zip -qry nexora-audiophile-simulator.app.zip "$APP"
          ls -lh nexora-audiophile-simulator.app.zip
        working-directory: ./ios

      - name: upload simulator app artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-audiophile-ios-simulator
          path: ios/nexora-audiophile-simulator.app.zip
          if-no-files-found: warn
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
    needs: [build-android, build-ios]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Nexora Audiophile ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            ## Install

            - **Android**: download the `.apk` and install it (allow unknown sources).
            - **iOS (free Apple ID)**: download the `.ipa` and sideload with
              [Sideloadly](https://sideloadly.io) or
              [AltStore](https://altstore.io) — see `SIDELOAD.md`.
            - **iOS Simulator**: download `nexora-audiophile-simulator.app.zip`,
              unzip, and drag `*.app` onto a running simulator.

            > iOS builds are unsigned on purpose — no paid Apple Developer
            > account is used in CI. Free-account sideloads expire after 7 days
            > and need a re-sign (AltStore can automate this while
            > AltServer is reachable).
          draft: false
          prerelease: false
          files: |
            bundles/**/*.apk
            bundles/**/*.ipa
            bundles/**/*.app.zip
